name: Backend CI Pipeline

on:
  push:
    branches:
      - stage
      - main
  pull_request:
    branches:
      - stage
      - main

jobs:
  build:
    name: Build & Validate Backend
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Enable pnpm via Corepack
      - name: Enable pnpm
        run: corepack enable

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5️⃣ Build NestJS app
      - name: Build application
        run: pnpm build
